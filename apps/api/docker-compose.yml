name: 'seat-sure'

services:
  monolith:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seat-sure-monolith
    profiles: ['all']
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://db:postgres@postgres:5432/seat_sure_test
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=seat_sure_test
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_started
    networks:
      - default
  db:
    image: postgres:15-alpine
    profiles: ['all', 'deps']
    container_name: seat-sure-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5432:5432'
    volumes:
      - .data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    profiles: ['all', 'deps']
    container_name: seat-sure-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning

volumes:
  redis-data:
  postgres-data:
